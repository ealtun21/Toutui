[package]
name = "toutui"
version = "0.4.2-beta"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0"
config = "0.15.6"
color-eyre = "0.6.3"
crossterm = "0.28.1"
ratatui = "0.29.0"
vlc-rc = "0.1.1"
tui-textarea = "0.7.0"
rusqlite = { version = "0.33.0", features = ["bundled"] }
regex = "1.11.1"
log = "0.4.25"
fern = "0.7.1"
chrono = "0.4.39"
magic-crypt = "4.0.1"
dotenv = "0.15.0"
dirs = "6.0.0"
clap = "4.5.37"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "mp4", "flac", "vorbis", "wav"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

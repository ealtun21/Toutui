[package]
name = "toutui"
version = "0.8.47"
edition = "2021"
description = "A TUI client of Audiobookshelf for Linux and macOS."
license = "GPL-3.0-or-later"
repository = "https://github.com/ealtun21/Toutui"
readme = "README.md"
authors = [
    "AlbanDAVID <https://github.com/AlbanDAVID>",
    "ealtun21 <https://github.com/ealtun21>",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15.6"
color-eyre = "0.6.3"
crossterm = "0.29"
ratatui = "0.30"
# One line of text for the address of the server, for the name of the user, for
# the password, and for the words of the search. `tui-input` holds that state,
# and the caller draws the text. See T-33.
#
# `tui-textarea` 0.7.0 came before it, and that crate asks for `ratatui ^0.29`.
# It has no newer version, therefore it held the project on the old ratatui.
#
# `tui-input` needs `unicode-segmentation` and `unicode-width` only. Both are
# pure Rust, therefore the build needs no C toolchain.
#
# The default feature `ratatui-crossterm` reads the events of crossterm through
# the copy of crossterm that ratatui holds. This project names crossterm
# itself, therefore it takes the feature `crossterm`. Both give crossterm
# 0.29, and the tree holds one copy only.
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
# The cover art. See T-23.
#
# The default features `chafa-dyn` and `chafa-static` need the C library chafa.
# Therefore the project takes no default feature.
#
# `image` needs its own line: `ratatui-image` asks for `image` with the feature
# `png` only, and a cover of Audiobookshelf is a JPEG file or a WebP file. The
# feature `image-defaults` adds decoders that a cover never needs.
#
# A measurement on 2026-08-10 read the tree after these two lines: `cargo tree
# -i cc` finds `libsqlite3-sys` and `ring` only, and `cargo tree -i
# openssl-sys` finds nothing.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# The place of the reader in the form of the web reader (EPUBCFI). See T-10 and
# `src/logic/reader/cfi.rs`. That module walks the tree of the XHTML of one
# chapter, therefore it needs a parser of XML.
#
# `rbook` already asks for `quick-xml` 0.41, therefore this line adds no crate
# to the tree. A measurement on 2026-08-11 gave the same list of crates before
# and after this line, and `cargo tree -i openssl-sys` still finds nothing.
# `quick-xml` is pure Rust with no default feature, therefore the build needs no
# C toolchain. It expands no entity of a DTD, therefore a file of the form
# "billion laughs" gives no growth of the memory. See T-20.
quick-xml = { version = "0.41", default-features = false }
# The reader of a PDF book. See T-54.
#
# Audiobookshelf holds a PDF beside an EPUB book, and the reader of T-10 showed
# EPUB books only. `lopdf` gives the text of each page and the pictures of each
# page.
#
# A measurement on 2026-08-11: the crate is MIT, it is pure Rust, `cargo tree -i
# cc` finds nothing of it, and `cargo tree -i openssl-sys` still finds nothing.
# `pdf-extract` gives the text only, and it uses `lopdf` itself. Therefore the
# fork takes `lopdf` and it writes the reader of the pictures.
#
# No crate of pure Rust draws a **page** of a PDF. `mupdf` needs a library of C
# and it is AGPL, therefore T-20 and the license refuse it. Toutui shows the text
# of a PDF and the pictures of a PDF. See T-51.
# The default features bring `chrono`, `jiff`, `rayon`, and `time`. The reader
# needs no date and no pool of threads, therefore the line takes no default
# feature. `chrono` stands in the tree already, for a different work.
lopdf = { version = "0.44", default-features = false }
log = "0.4.25"
fern = "0.7.1"
chrono = "0.4.39"
magic-crypt = "5"
dirs = "6.0.0"
clap = "4.5.37"
# `symphonia-all` gives every codec and every container that symphonia has.
# A measurement on 2026-08-10 shows that this adds ALAC, AIFF, ADPCM, CAF,
# MKV, WebM, MP1, and MP2. All of them are pure Rust. Opus and WMA stay
# outside, because symphonia has no decoder for them.
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
rodio-wsola = "0.2"
# Opus. `rodio::Decoder` uses the fixed codec registry of symphonia, and that
# registry has no Opus decoder. Therefore the project reads the packets with
# symphonia and decodes them with `opuscule`. See T-17.
#
# `all-formats` gives the readers only. The codecs come from rodio.
#
# A measurement on 2026-08-10 examined four pure Rust decoders with 47 files in
# a debug build, where Rust examines every arithmetic operation. `opus-decoder`
# 0.1.1 stopped the program on 13 files, and `mousiki` 0.2.1 stopped it on 15.
# `moosicbox_opus_native` 0.4.0 has `todo!()` in `decode_float`. `opuscule`
# 0.2.0 played all 47 files, and its samples agree with libopus.
#
# `opuscule` forbids `unsafe` code, therefore a fault of the crate gives a
# panic or a wrong sample, and never damage of the memory. The engine catches
# such a panic and stops the one track. See T-17 and
# `src/player/engine/opus.rs`.
#
# Both crates are pure Rust: the build needs no C toolchain, and the binary
# needs no library of the system.
symphonia = { version = "0.5.5", default-features = false, features = ["all-formats"] }
opuscule = "0.2.0"
# The update compares the sum of the archive and opens the archive. The three
# crates below are pure Rust, therefore the build needs no C toolchain.
sha2 = "0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
tempfile = "3"
# Compares versions, so that the program does not install a release that is
# older than the build it runs. Pure Rust; needs no C toolchain.
semver = "1"
dotenvy = "0.15.7"
# The reader of EPUB. See T-10 and
# `docs/superpowers/specs/2026-08-10-epub-reader-design.md`.
#
# `default-features = false` removes the writer, and the reader does not need
# it. `threadsafe` keeps `Epub` as `Send + Sync`, thus a task can hold the book.
#
# A measurement on 2026-08-10 examined four crates. `epub-parser` brings
# `bzip2-sys`, `lzma-sys`, and `zstd-sys`, and `iepub` brings `zstd-sys`;
# neither is acceptable. The crate `epub` has no way to stop a read, therefore
# a zip archive of 2 megabytes that opens to 2 gigabytes stops the whole
# process. `rbook` has `copy_bytes`, and with a limit of 8 megabytes the same
# file uses 5 megabytes of memory.
rbook = { version = "0.7.10", default-features = false, features = ["threadsafe"] }
# Turns XHTML into lines with a style. It uses html5ever, the parser of Servo,
# therefore a page with an error cannot stop the parse.
html2text = { version = "0.17.1", features = ["xml"] }

[dev-dependencies]
wiremock = "0.6"

# The clock of the test. See the harness of `docs/HANDOVER.md`.
#
# `test-util` gives `#[tokio::test(start_paused = true)]`, and that test then
# holds a clock of its own: a `sleep` of one second in the code takes no real
# time, and the loop of the playback still makes each of its steps. One test of
# 8.0 seconds became a test of 0.02 seconds with it.
#
# It is a feature of a dependency that the program has already, and the
# resolver of the edition 2021 keeps a feature of a dev-dependency away from
# the binary of the release. Therefore the rule of T-20 stays.
tokio = { version = "1", features = ["test-util"] }

# The build of the development. See T-64.
#
# A test binary of this project holds every dependency and the whole debug
# information, and that gives about 300 megabytes. `cargo test` makes 36 such
# binaries, and cargo keeps the binary of every build that came before: a session
# of one day gave `target/debug` of **221 gigabytes**, and the disk of the
# maintainer became full.
#
# `line-tables-only` keeps the file and the line of every frame, therefore a panic
# of a test still names its place. It holds no type and no variable, therefore a
# debugger of a step gives less. The tests of this project read the message of a
# panic and the value of an assertion, and no test needs a debugger.
[profile.dev]
debug = "line-tables-only"

[package]
name = "abstui"
version = "0.5.0-beta"
edition = "2021"
description = "A TUI client of Audiobookshelf for Linux and macOS."
license = "GPL-3.0-or-later"
repository = "https://github.com/ealtun21/abstui"
readme = "README.md"
keywords = ["audiobookshelf", "audiobook", "tui", "podcast", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]
authors = [
    "AlbanDAVID <https://github.com/AlbanDAVID>",
    "ealtun21 <https://github.com/ealtun21>",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0"
config = "0.15.6"
color-eyre = "0.6.3"
crossterm = "0.28.1"
ratatui = "0.29.0"
tui-textarea = "0.7.0"
rusqlite = { version = "0.33.0", features = ["bundled"] }
log = "0.4.25"
fern = "0.7.1"
chrono = "0.4.39"
magic-crypt = "4.0.1"
dotenv = "0.15.0"
dirs = "6.0.0"
clap = "4.5.37"
# `symphonia-all` gives every codec and every container that symphonia has.
# A measurement on 2026-08-10 shows that this adds ALAC, AIFF, ADPCM, CAF,
# MKV, WebM, MP1, and MP2. All of them are pure Rust. Opus and WMA stay
# outside, because symphonia has no decoder for them.
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
rodio-wsola = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

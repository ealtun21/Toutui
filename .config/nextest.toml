# The configuration of `cargo nextest`, a tool of the machine.
#
# `cargo test` runs the 37 test binaries one after the other, and the run takes
# the sum of their times. nextest runs every test of every binary in one pool of
# processes, and the run then takes the time of the slowest test. A measurement
# of 2026-08-11: 18.7 seconds with `cargo test`, and 8.6 seconds with nextest.
#
# nextest is **not** a dependency of the program. `Cargo.toml` does not change,
# and a user who builds with `cargo install --git` needs it not. The rule of
# T-20 stays.
#
#     cargo nextest run                          # the tests that need no server
#     cargo nextest run --run-ignored all        # the tests of the sandbox too
#
# See `docs/HANDOVER.md` for the numbers, and `docs/TEST-SERVER.md` for the
# sandbox.

# The tests of the sandbox make a login, and the server permits 40 requests of
# the login in 600 seconds. Therefore one such test runs at a time.
[test-groups.the-sandbox]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(/_against_the_sandbox$/)'
test-group = 'the-sandbox'

# A test of the sandbox waits for the server, for a transcode, and for the sync
# of ten seconds. It is slow, and it is not lost.
slow-timeout = { period = "60s", terminate-after = 4 }

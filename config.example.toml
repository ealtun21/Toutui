#### SERVERS ####
# One Audiobookshelf server can have more than one address. An example is a
# fast local address at home and a public address away from home.
#
# The application always uses the address that has the most importance and
# that answers. A low `priority` value gives more importance.
#
# The application examines an address that does not answer every 60 seconds.
# Therefore it returns to the local address automatically.
#
# This block is optional. If you do not add it, the application uses the
# address that you gave at the login screen.
#
# [[servers]]
# name = "home"
# endpoints = [
#   { url = "http://192.168.1.10:13378", priority = 0 },
#   { url = "https://abs.example.com",   priority = 1 },
# ]

#### PLAYER ####
# The application plays the audio itself. It does not need VLC.
#
# The block [player] of an older version is no longer necessary. The
# application does not read it, and it does not fail if the block stays.
#
# The keys of that block controlled VLC:
#   cvlc, cvlc_term, address, port
# The application has no separate program now, thus it needs none of them.
#
# The application uses the default sound device. To use a different device,
# give its name in the variable TOUTUI_AUDIO_DEVICE:
#   TOUTUI_AUDIO_DEVICE="pipewire" toutui

#### COLORS (RGB) ####
[colors]
# General background color of the app:
background_color = [40, 40, 40]
# Login background color:
log_background_color = [40, 40, 40]
# Background color for section headers (e.g., "Continue Listening", "Library", etc.):
header_background_color = [60, 60, 60]
# Line color surrounding the header title:
line_header_color = [180, 180, 180]
# Background color of the book list:
list_background_color = [50, 50, 50]
# Background color for alternate rows of the book list:
list_background_color_alt_row = [60, 60, 60]
# Background color of the selected row of the book list:
list_selected_background_color = [80, 80, 80]
# Text color of the selected row of the book list:
list_selected_foreground_color = [180, 180, 180]
# Text and border color of the search bar:
search_bar_foreground_color = [180, 180, 180]
# Text and border color of the login section:
login_foreground_color = [180, 180, 180]
# Background color of the player:
player_background_color = [80, 80, 80]

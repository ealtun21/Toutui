name: Release

# The workflow writes the release, and it makes a proof of the origin of
# each asset.
permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          # cargo-zigbuild gives a floor of glibc 2.17. Therefore one binary
          # operates from CentOS 7 and later.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build: zig
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            build: zig
          - target: universal-apple-darwin
            os: macos-latest
            build: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A tag that does not agree with Cargo.toml gives every user an update
      # that never completes. The workflow stops here instead.
      - name: Confirm that the tag and Cargo.toml agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$tag" != "$crate" ]; then
            echo "The tag $GITHUB_REF_NAME and the version $crate do not agree."
            exit 1
          fi
          echo "The tag and the version agree: $crate"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The audio system of the machine gives the headers. The binary
      # connects to the libasound of the user at the time it runs.
      - name: Install the audio system headers
        if: matrix.build == 'zig'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Ubuntu 24.04 marks its Python as externally managed, therefore pip
      # refuses to write into it. cargo-zigbuild runs `python3 -m ziglang`,
      # thus the package must go into the Python of the system.
      - name: Install cargo-zigbuild
        if: matrix.build == 'zig'
        run: |
          pip install --break-system-packages ziglang
          python3 -m ziglang version
          cargo install cargo-zigbuild --locked

      - name: Build for Linux
        if: matrix.build == 'zig'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17

      - name: Build for macOS
        if: matrix.build == 'mac'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/${{ matrix.target }}/release
          lipo -create -output target/${{ matrix.target }}/release/toutui \
            target/aarch64-apple-darwin/release/toutui \
            target/x86_64-apple-darwin/release/toutui

      - name: Make the archive
        run: |
          tar -czf toutui-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release toutui

      - uses: actions/upload-artifact@v4
        with:
          name: toutui-${{ matrix.target }}
          path: toutui-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the other files
        run: |
          cp config.example.toml dist/
          cp linux/toutui.desktop dist/

      # The machine writes the sums. No person writes a sum in a file.
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum toutui-*.tar.gz config.example.toml toutui.desktop > SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/toutui-*.tar.gz

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

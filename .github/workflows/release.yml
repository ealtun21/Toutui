name: Release

# The workflow writes the release, and it makes a proof of the origin of
# each asset.
permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          # The build for Linux runs inside a container of Debian bullseye.
          # The binary and the libasound that it links then come from one
          # system, and the floor becomes glibc 2.31: Debian 11 and later,
          # Ubuntu 20.04 and later, RHEL 9.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: 'debian:bullseye'
            bin_dir: target/release
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: 'debian:bullseye'
            bin_dir: target/release
          - target: universal-apple-darwin
            os: macos-latest
            container: ''
            build: mac
            bin_dir: target/universal-apple-darwin/release
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # The image of bullseye holds no git and no compiler. This step comes
      # before the checkout, because the checkout needs git.
      - name: Install the tools of the build
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config libasound2-dev

      - uses: actions/checkout@v4

      # A tag that does not agree with Cargo.toml gives every user an update
      # that never completes. The workflow stops here instead.
      - name: Confirm that the tag and Cargo.toml agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$tag" != "$crate" ]; then
            echo "The tag $GITHUB_REF_NAME and the version $crate do not agree."
            exit 1
          fi
          echo "The tag and the version agree: $crate"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.container == ''

      - uses: Swatinem/rust-cache@v2
        if: matrix.container == ''

      - name: Install Rust
        if: matrix.container != ''
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build for Linux
        if: matrix.container != ''
        run: cargo build --release --locked

      - name: Build for macOS
        if: matrix.build == 'mac'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/toutui \
            target/aarch64-apple-darwin/release/toutui \
            target/x86_64-apple-darwin/release/toutui

      - name: Make the archive
        run: tar -czf toutui-${{ matrix.target }}.tar.gz -C ${{ matrix.bin_dir }} toutui

      - uses: actions/upload-artifact@v4
        with:
          name: toutui-${{ matrix.target }}
          path: toutui-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the other files
        run: |
          cp config.example.toml dist/
          cp linux/toutui.desktop dist/

      # The machine writes the sums. No person writes a sum in a file.
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum toutui-*.tar.gz config.example.toml toutui.desktop > SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/toutui-*.tar.gz

      # A tag that holds a hyphen is a candidate, for example `v0.6.0-rc.1`.
      # GitHub must mark it as a pre-release, because
      # `/releases/latest` gives no pre-release. The program asks that
      # address, therefore a candidate never reaches a user who did not ask
      # for it. See T-28 and `src/utils/check_update.rs`.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

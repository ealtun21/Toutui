name: CI

on:
  push:
    branches: [ main, offline-mode ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the Cargo directories
        uses: Swatinem/rust-cache@v2

      # Sub-project 2 adds the audio engine, and that engine needs these
      # headers. The step is here now so that the workflow does not change
      # later.
      - name: Install the audio system headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --verbose

      - name: Examine the code with clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test --verbose

      # The project must not need a C toolchain. This step fails if a
      # dependency brings OpenSSL back.
      - name: Confirm that OpenSSL is not a dependency
        run: |
          if cargo tree -i openssl-sys > /dev/null 2>&1; then
            echo "A dependency needs OpenSSL. Give that dependency default-features = false."
            cargo tree -i openssl-sys
            exit 1
          fi
          echo "OpenSSL is not in the dependency tree."

  # `flake.nix` and `flake.lock` are in the repository, and the README tells
  # the user to run `nix build`. No job read them before, therefore the flake
  # could stop to operate and every test stayed green. See T-27.
  #
  # This job is the only test of the flake. A machine of the development
  # cannot always run Nix.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # `nix flake check` reads every output of the flake. It finds a flake
      # that does not evaluate.
      #
      # `--all-systems` reads the outputs of macOS as well, and not the
      # outputs of this runner alone. The first job found a fault of macOS
      # that no test on Linux can find: the flake named
      # `pkgs.darwin.apple_sdk.frameworks`, nixpkgs removed that attribute,
      # and `optionals` reads its list only on macOS.
      - name: Check the flake
        run: nix flake check --all-systems --print-build-logs

      # Only a build finds a dependency that does not compile with the
      # dependencies that the flake gives. The flake has `doCheck = true`,
      # therefore this step runs the tests of the project as well.
      - name: Build the flake
        run: nix build --print-build-logs
